<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de Contratos · Periferia IT Group</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <img src="/logo.svg" alt="" class="logo" width="36" height="36">
      <div>
        <h1>Asistente de Contratos</h1>
        <p class="subtitulo">Periferia IT Group · Registro de contratos vigentes</p>
      </div>
    </div>
    <div class="acciones">
      <span id="estado" class="estado"><span class="punto-estado"></span><span id="estado-texto">Conectando…</span></span>
      <button id="nueva" type="button" class="icono" title="Nueva conversación" aria-label="Nueva conversación">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="reset" type="button" class="icono" title="Reiniciar datos (vuelve al maestro original)" aria-label="Reiniciar datos">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <main id="scroll">
    <div id="chat" class="columna" aria-live="polite"></div>
  </main>

  <footer class="pie">
    <form id="form" class="columna">
      <div class="compositor">
        <textarea id="entrada" rows="1" maxlength="4000" placeholder="Escribe un mensaje…" aria-label="Mensaje" required></textarea>
        <button id="enviar" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p class="aviso">El asistente pide tu confirmación antes de registrar cualquier dato dudoso.</p>
    </form>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
