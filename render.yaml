# Blueprint de Render: crea el servicio web desde este repo.
# En Render: New > Blueprint > selecciona el repo. Te pedirá GEMINI_API_KEY.
services:
  - type: web
    name: agente-contratos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        value: gemini-3.5-flash
      - key: MODEL_FALLBACKS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: MAX_ITERATIONS
        value: "25"
      - key: MAX_TOKENS_PER_SESSION
        value: "400000"
      - key: MAX_LLM_CALLS_PER_DAY
        value: "150"
